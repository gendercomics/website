# build, publish and deploy an API docker image

name: production - build, publish & deploy docker image

on:
  push:
    tags:
      - '*'
  # dispatched by gendercomics/content (publish.yml) after a content release is approved;
  # it runs against the latest release tag, so only released code goes live
  workflow_dispatch:
    inputs:
      content_ref:
        description: gendercomics/content ref to build with
        default: production

concurrency:
  group: deploy-production

jobs:
  push_to_registry:
    name: push docker image to docker hub
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: check out the repo
        uses: actions/checkout@v7

      - name: check out content
        uses: actions/checkout@v7
        with:
          repository: gendercomics/content
          # code releases always ship the last approved content
          ref: ${{ inputs.content_ref || 'production' }}
          path: .content

      - name: determine image version
        id: version
        run: echo "version=${{ github.ref_name }}-content-$(git -C .content rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: log in to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: extract metadata (tags, labels) for docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: gendercomics/website
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
          flavor: |
            latest=true

      - name: build and push docker image
        uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile
          # build from the workspace so the .content checkout is part of the build context
          context: .
          build-args: |
            NODE_VERSION=22
            VUE_APP_API_URL=https://api.gendercomics.net/
            NUXT_PUBLIC_POSTHOG_KEY=${{ secrets.NUXT_PUBLIC_POSTHOG_KEY }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy_production:
    needs: push_to_registry
    name: production deployment to digitalocean.com
    runs-on: ubuntu-latest
    steps:
      - name: check out the repo
        uses: actions/checkout@v7

      - name: deploy production
        uses: alinz/ssh-scp-action@97ad76feb6460d3392b63f11ac354568c89b8968 # v0.1.2
        with:
          key: ${{ secrets.DEPLOY_KEY }}
          host: ${{ secrets.APP_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          # runs this on remove server
          ssh_before: |
            echo 'PRODUCTION: deploying ${{ needs.push_to_registry.outputs.version }}'
            cd /var/gendercomics/website
            ls -lath

          # then upload docker-compose.yml
          scp: |
            ./docker-compose.yml ${{ secrets.DEPLOY_USER }}@${{ secrets.APP_HOST }}:/var/gendercomics/website

          # then run these commands
          ssh_after: |
            echo 'running docker-compose'
            cd /var/gendercomics/website
            docker pull gendercomics/website:${{ needs.push_to_registry.outputs.version }}
            WEBSITE_VERSION=${{ needs.push_to_registry.outputs.version }} docker-compose up -d gendercomics-website
            echo 'DONE!!!'
