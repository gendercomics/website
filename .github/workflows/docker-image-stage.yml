# build, publis and deploy an API docker image

name: stage - build, publish & deploy docker image

on:
  push:
  # dispatched by gendercomics/content (publish.yml) when content changes
  workflow_dispatch:
    inputs:
      content_ref:
        description: gendercomics/content ref to build with
        default: main

concurrency:
  group: deploy-stage

jobs:
  push_to_registry:
    name: push docker image to docker hub
    # dependabot-triggered runs have no access to repo secrets, so docker hub login would always fail
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: check out the repo
        uses: actions/checkout@v7

      - name: check out content
        uses: actions/checkout@v7
        with:
          repository: gendercomics/content
          ref: ${{ inputs.content_ref || 'main' }}
          path: .content

      - name: log in to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: extract metadata (tags, labels) for docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: gendercomics/website-stage
          tags: |
            type=ref,event=branch
            type=ref,event=tag
          flavor: |
            latest=true

      - name: build and push docker image
        uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile
          # build from the workspace so the .content checkout is part of the build context
          context: .
          build-args: |
            NODE_VERSION=22
            VUE_APP_API_URL=https://api-stage.gendercomics.net/
            NUXT_PUBLIC_POSTHOG_KEY=${{ secrets.NUXT_PUBLIC_POSTHOG_KEY }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy_stage:
    needs: push_to_registry
    name: stage deployment to digitalocean.com
    runs-on: ubuntu-latest
    steps:
      - name: check out the repo
        uses: actions/checkout@v7

      - name: deploy stage
        uses: alinz/ssh-scp-action@97ad76feb6460d3392b63f11ac354568c89b8968 # v0.1.2
        with:
          key: ${{ secrets.DEPLOY_KEY }}
          host: ${{ secrets.APP_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          # runs this on remove server
          ssh_before: |
            echo 'STAGE: deploying ${{ github.ref }}'
            cd /var/gendercomics/website
            ls -lath

          # then upload docker-compose.yml
          scp: |
            ./docker-compose.yml ${{ secrets.DEPLOY_USER }}@${{ secrets.APP_HOST }}:/var/gendercomics/website

          # then run these commands
          ssh_after: |
            echo 'running docker-compose'
            docker pull gendercomics/website-stage:latest
            cd /var/gendercomics/website
            docker-compose up -d gendercomics-website-stage
            echo 'DONE!!!'
