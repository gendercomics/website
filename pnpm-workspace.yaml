allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  vue-demi: true

overrides:
  # ipx@2.1.1 (pulled in by @nuxt/image) pins sharp ^0.32.6, which has
  # known libvips CVEs (GHSA fixed in 0.35.0). Force the patched version;
  # ipx only uses sharp's stable resize/format API, unaffected by the bump.
  sharp: ^0.35.4
  # @apidevtools/json-schema-ref-parser (pulled in by @nuxt/content, build-time
  # only) pins an older js-yaml with a CPU-exhaustion DoS (GHSA-2883-xcg3-v3hh,
  # fixed in 4.3.2). Stay on the 4.x line to avoid an unreviewed major bump.
  js-yaml: '>=4.3.2 <5'
  # postcss-svgo (pulled in by nuxt's Vite build via cssnano, build-time only)
  # pins svgo <4.1.0, which has a removeScripts sanitizer bypass
  # (GHSA-4vpr-x523-8j87, GHSA-w27v-7q3p-w38r).
  svgo: ^4.1.0
  # undici <8.10.2 is vulnerable to cross-origin cache poisoning via missing
  # origin isolation in interceptors (GHSA). Pulled in by nuxt (build/dev
  # fetch paths only - production ships static HTML from nginx). nuxt allows
  # ^8.10.0, but a plain `pnpm update` re-resolves oxc-parser downwards, so
  # pin the floor here instead.
  undici: ^8.10.2
  # devalue <5.9.2 has a DoS via malformed input. Pulled in by nuxt,
  # @nuxt/nitro-server and @nuxtjs/i18n for payload serialization; all three
  # allow the patched range.
  devalue: ^5.9.2
  # brace-expansion: pulled in transitively by minimatch (eslint,
  # typescript-eslint, editorconfig, glob - all dev/lint-time only), on two
  # coexisting major lines, each with its own DoS advisory (quadratic-time
  # expansion / uncontrolled recursion causing stack exhaustion). A flat
  # override would force both lines to one version and break whichever
  # consumer needs the other, so pin per parent instead. A plain
  # `pnpm update` also re-resolves oxc-parser downwards (see undici/devalue
  # override above), so overrides are used here too.
  minimatch@5.1.9>brace-expansion: ^2.1.7
  minimatch@9.0.9>brace-expansion: ^2.1.7
  minimatch@10.2.6>brace-expansion: ^5.0.12
